# Habilitar el Demonio de Gradle para mantener los procesos calientes en memoria
org.gradle.daemon=true

# Ejecutar tareas en paralelo para aprovechar los 18 núcleos de la CPU
org.gradle.parallel=true

# Almacenar en caché los resultados de las tareas para no repetir compilaciones
org.gradle.caching=true

# Configuración de memoria optimizada para la JVM de Gradle
# Asigna un tamaño generoso para proyectos Java grandes sin saturar el sistema
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC -Dfile.encoding=UTF-8


# Habilitar el nuevo sistema de aislamiento de configuración para acelerar el arranque
org.gradle.configuration-cache=true
